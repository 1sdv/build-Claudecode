name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip UTF-8 BOM from all Markdown files
        run: |
          python3 -c "
          import os
          count = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', '_site', 'vendor', 'node_modules']]
              for fname in files:
                  if fname.endswith('.md'):
                      fpath = os.path.join(root, fname)
                      with open(fpath, 'rb') as f:
                          content = f.read()
                      if content.startswith(b'\xef\xbb\xbf'):
                          with open(fpath, 'wb') as f:
                              f.write(content[3:])
                          count += 1
                          print(f'BOM removed: {fpath}')
          print(f'Total files fixed: {count}')
          "

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Debug - Verify _site
        run: |
          echo "=== _site root (all files) ==="
          ls -la _site/
          echo ""
          echo "=== index.html exists? ==="
          test -f _site/index.html && echo "YES" || echo "NO"
          echo ""
          echo "=== All HTML files in _site ==="
          find _site -name "*.html" | head -20
          echo ""
          echo "=== Total ==="
          find _site -type f | wc -l
          du -sh _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4