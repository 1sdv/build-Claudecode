title: "深入 Claude Code 源码：构建 AI 编程代理"
description: "面向开发者的系统课程，通过逐层剖析 Claude Code v2.1.88 的真实源码，系统掌握 AI 编程代理的工程实现"
baseurl: "/build-Claudecode"
url: "https://1sdv.github.io"

# Theme
theme: just-the-docs

# Color scheme
color_scheme: dark

# Navigation
nav_fold: false

# Search - full-text across all pages
search_enabled: true
search:
  heading_level: 3
  previews: 5
  preview_words_before: 8
  preview_words_after: 15
  tokenizer_separator: /[\s\-\/\.]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

# Footer
footer_content: ''

# Markdown settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - legacy-v1/
  - .git/
  - .gitignore

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
